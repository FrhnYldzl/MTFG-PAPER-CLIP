# Railway / Nixpacks yapılandırması
[phases.setup]
nixPkgs = ["nodejs_20", "pnpm-9_x"]

[phases.install]
# --prod=false: NODE_ENV=production olsa bile devDependencies (tsc, vite) kurulur
cmds = ["pnpm install --frozen-lockfile --prod=false"]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "pnpm migrate && pnpm start"
